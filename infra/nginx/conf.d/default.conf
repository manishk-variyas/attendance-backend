# Trust the fronting proxy at 192.168.122.1 so $remote_addr (and the
# limit_req/limit_conn zones below) reflect the real client IP instead of the
# shared proxy IP. The backend VM is private-only (no firewall, not publicly
# addressed), so this header cannot be spoofed from the internet.
set_real_ip_from 192.168.122.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn_status 429;

# Do not log 429 Too Many Requests to avoid log wiping
map $status $loggable {
    429     0;
    default 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;
    server_tokens off;

    # Conditional access logging
    access_log /var/log/nginx/access.log combined if=$loggable;

    # Timeouts to drop slow attackers (Slowloris protection)
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Limit concurrent connections per IP
    limit_conn conn_limit 20;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Auth routes with strict rate limiting
    location ^~ /auth/ {
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        limit_req zone=login_limit burst=10 nodelay;

        # WebSocket disabled
        proxy_http_version 1.0;

        # Forward original host, IP, and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies
        proxy_set_header Cookie $http_cookie;
    }

    # All other routes with looser rate limiting
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        limit_req zone=api_limit burst=50 nodelay;

        # WebSocket disabled
        proxy_http_version 1.0;

        # Forward original host, IP, and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies
        proxy_set_header Cookie $http_cookie;
    }

    # Admin Panel - Separate Service
    # allow 192.168.1.0/24;
    # deny all;
}
