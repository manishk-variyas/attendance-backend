# Monitoring Stack Docker Compose Configuration
#
# Services included:
# - Prometheus (Time-series metrics collector, 7d/2GB storage cap)
# - Tempo (Distributed tracing backend, receives OpenTelemetry OTLP)
# - Grafana (Dashboards & Visualization on port 3001)

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: infra-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - infra-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: infra-tempo
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "127.0.0.1:3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - infra-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: infra-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - infra-network

networks:
  infra-network:
    driver: bridge

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
