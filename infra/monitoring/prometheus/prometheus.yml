global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Host OS metrics (CPU, RAM, Disk, Load)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Docker container metrics (cAdvisor: per-container CPU, RAM, IO)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["host.docker.internal:8086"]

  # FastAPI Backend metrics
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
